<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>チェックひろ</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" width="24" height="24">
    <h1>チェックひろ</h1>
  </header>

  <label class="toggle">
    <span class="toggle-label">
      <span class="toggle-title">機能を有効にする</span>
      <span class="toggle-status" id="status">…</span>
    </span>
    <input type="checkbox" id="enabled">
    <span class="switch" aria-hidden="true"></span>
  </label>

  <p class="hint">
    先頭をクリック → <kbd>Shift</kbd> を押しながら末尾をクリックで、間のチェックボックスをまとめて切り替えます。
  </p>

  <p class="note" id="note" hidden>
    設定は開いているページにも即時反映されます。
  </p>

  <script src="popup.js"></script>
</body>
</html>
